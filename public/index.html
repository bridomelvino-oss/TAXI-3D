<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paintball 3D</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Import map : Three.js est servi localement par le serveur (dependance npm),
       pas de CDN externe. Pas de bundler pour l'instant, simple a iterer en solo. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
  <!-- Client Socket.io : servi automatiquement par le serveur (pas de CDN, pas de build) -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="fps-counter">-- FPS</div>
    <div id="scoreboard">
      <span class="score score--blue"><span id="score-blue">0</span></span>
      <span class="score-round">Manche <span id="round-number">1</span></span>
      <span class="score score--red"><span id="score-red">0</span></span>
    </div>
  </div>

  <div id="crosshair" class="hidden">
    <div class="crosshair-dot"></div>
    <div class="crosshair-line crosshair-line--top"></div>
    <div class="crosshair-line crosshair-line--bottom"></div>
    <div class="crosshair-line crosshair-line--left"></div>
    <div class="crosshair-line crosshair-line--right"></div>
  </div>
  <div id="hitmarker"></div>

  <div id="round-banner" class="hidden"></div>

  <!-- Ecran de menu : creer ou rejoindre un salon -->
  <div id="screen-menu" class="screen">
    <div class="screen-box">
      <h1>Paintball 3D</h1>
      <p class="subtitle">Jeu de paintball 3D multijoueur en salon prive</p>

      <label class="field-label" for="player-name">Ton pseudo</label>
      <input id="player-name" class="text-input" type="text" maxlength="16" placeholder="Pseudo" />

      <div class="menu-actions">
        <button id="create-room-button" class="primary-button">Creer un salon</button>

        <div class="join-row">
          <input id="join-code-input" class="text-input code-input" type="text" maxlength="4" placeholder="CODE" />
          <button id="join-room-button" class="secondary-button">Rejoindre</button>
        </div>
      </div>

      <p id="menu-error" class="error-text hidden"></p>
    </div>
  </div>

  <!-- Ecran de salon : code, joueurs, pret, lancement (hote) -->
  <div id="screen-lobby" class="screen hidden">
    <div class="screen-box">
      <h1>Salon</h1>
      <p class="subtitle">Code a partager : <span id="lobby-code" class="room-code"></span></p>

      <ul id="lobby-players" class="player-list"></ul>

      <div class="menu-actions">
        <button id="ready-button" class="secondary-button">Pret</button>
        <button id="start-button" class="primary-button hidden">Lancer la partie</button>
        <button id="leave-button" class="text-button">Quitter le salon</button>
      </div>

      <p id="lobby-error" class="error-text hidden"></p>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div id="overlay-box">
      <h1>C'est parti</h1>
      <p id="overlay-subtitle">Manche 1</p>
      <ul>
        <li><strong>Z Q S D</strong> : se deplacer</li>
        <li><strong>Espace</strong> : sauter</li>
        <li><strong>Souris</strong> : regarder / orienter la camera</li>
        <li><strong>Clic gauche</strong> : tirer</li>
      </ul>
      <button id="play-button">Cliquer pour jouer</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
