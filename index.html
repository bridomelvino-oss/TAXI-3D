<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Attrape les Étoiles</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0c29;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  }

  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 800px;
    background: linear-gradient(180deg, #1a1a3e 0%, #2d1b4e 100%);
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }

  .badge {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 16px;
    border-radius: 20px;
    color: white;
    font-weight: 600;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge .icon {
    font-size: 18px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 12, 41, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    color: white;
    text-align: center;
    padding: 20px;
    transition: opacity 0.3s;
  }

  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #overlay h1 {
    font-size: 42px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffd700, #ff8a00);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -1px;
  }

  #overlay p {
    font-size: 16px;
    opacity: 0.8;
    margin-bottom: 28px;
    max-width: 320px;
    line-height: 1.5;
  }

  #overlay .finalScore {
    font-size: 22px;
    margin-bottom: 20px;
    font-weight: 600;
  }

  #overlay .finalScore span {
    color: #ffd700;
  }

  #playBtn {
    background: linear-gradient(135deg, #ff8a00, #e52e71);
    color: white;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(229, 46, 113, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  #playBtn:active {
    transform: scale(0.96);
    box-shadow: 0 5px 15px rgba(229, 46, 113, 0.4);
  }

  .hint {
    margin-top: 24px;
    font-size: 13px;
    opacity: 0.6;
  }
</style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="badge"><span class="icon">⭐</span><span id="score">0</span></div>
      <div class="badge"><span class="icon">❤️</span><span id="lives">3</span></div>
    </div>

    <div id="overlay">
      <h1>Attrape les Étoiles</h1>
      <p>Déplace le panier pour attraper les étoiles <strong>⭐</strong> et évite les bombes <strong>💣</strong> !</p>
      <div class="finalScore" id="finalScore" style="display:none;">Score : <span id="finalScoreValue">0</span></div>
      <button id="playBtn">JOUER</button>
      <div class="hint">📱 Glisse ton doigt &nbsp;•&nbsp; 💻 Flèches ← →</div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const finalScore = document.getElementById('finalScore');
  const finalScoreValue = document.getElementById('finalScoreValue');

  let W = 0, H = 0;
  let basket, items, particles, stars;
  let score = 0, lives = 3;
  let running = false;
  let spawnTimer = 0;
  let spawnInterval = 900;
  let lastTime = 0;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = rect.width;
    H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);

  function initStars() {
    stars = [];
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.8 + 0.2,
        s: Math.random() * 0.5 + 0.1
      });
    }
  }

  function reset() {
    score = 0;
    lives = 3;
    items = [];
    particles = [];
    spawnInterval = 900;
    basket = {
      x: W / 2,
      y: H - 70,
      w: 70,
      h: 50,
      target: W / 2
    };
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }

  function spawnItem() {
    const isBomb = Math.random() < 0.22;
    items.push({
      x: 30 + Math.random() * (W - 60),
      y: -30,
      vy: 2 + Math.random() * 2 + score * 0.02,
      r: 18,
      bomb: isBomb,
      rot: 0,
      rotSpeed: (Math.random() - 0.5) * 0.1
    });
  }

  function spawnParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function update(dt) {
    // background stars
    for (const s of stars) {
      s.y += s.s;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // basket smooth follow
    basket.x += (basket.target - basket.x) * 0.25;
    basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

    // spawn
    spawnTimer += dt;
    if (spawnTimer > spawnInterval) {
      spawnTimer = 0;
      spawnItem();
      if (spawnInterval > 400) spawnInterval -= 8;
    }

    // items
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy;
      it.rot += it.rotSpeed;

      // collision with basket
      const bx1 = basket.x - basket.w / 2;
      const bx2 = basket.x + basket.w / 2;
      const by1 = basket.y - 10;
      if (it.y + it.r > by1 && it.y < basket.y + basket.h &&
          it.x > bx1 - 10 && it.x < bx2 + 10) {
        if (it.bomb) {
          lives--;
          spawnParticles(it.x, it.y, '255,80,80', 18);
          shake();
        } else {
          score++;
          spawnParticles(it.x, it.y, '255,215,0', 14);
        }
        updateHUD();
        items.splice(i, 1);
        if (lives <= 0) { gameOver(); return; }
        continue;
      }

      // missed
      if (it.y > H + 40) {
        if (!it.bomb) {
          lives--;
          updateHUD();
          if (lives <= 0) { gameOver(); return; }
        }
        items.splice(i, 1);
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.025;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  let shakeAmount = 0;
  function shake() { shakeAmount = 10; }

  function draw() {
    let ox = 0, oy = 0;
    if (shakeAmount > 0) {
      ox = (Math.random() - 0.5) * shakeAmount;
      oy = (Math.random() - 0.5) * shakeAmount;
      shakeAmount *= 0.85;
      if (shakeAmount < 0.5) shakeAmount = 0;
    }
    ctx.save();
    ctx.translate(ox, oy);

    ctx.clearRect(-20, -20, W + 40, H + 40);

    // background stars
    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // items
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      if (it.bomb) {
        drawBomb(0, 0, it.r);
      } else {
        drawStar(0, 0, it.r);
      }
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = `rgba(${p.color},${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // basket
    drawBasket(basket.x, basket.y, basket.w, basket.h);

    ctx.restore();
  }

  function drawStar(cx, cy, r) {
    // glow
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2);
    g.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
    g.addColorStop(1, 'rgba(255, 215, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2, 0, Math.PI * 2);
    ctx.fill();

    // star shape
    ctx.fillStyle = '#ffd700';
    ctx.strokeStyle = '#ff8a00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const angle = (Math.PI / 5) * i - Math.PI / 2;
      const radius = i % 2 === 0 ? r : r * 0.45;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function drawBomb(cx, cy, r) {
    // body
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    // fuse
    ctx.strokeStyle = '#8b5a2b';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.5, cy - r * 0.7);
    ctx.quadraticCurveTo(cx + r, cy - r * 1.3, cx + r * 0.8, cy - r * 1.6);
    ctx.stroke();
    // spark
    ctx.fillStyle = '#ff6b00';
    ctx.beginPath();
    ctx.arc(cx + r * 0.8, cy - r * 1.6, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(cx + r * 0.8, cy - r * 1.6, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBasket(cx, cy, w, h) {
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + h / 2 + 6, w / 2.2, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // basket body
    const grad = ctx.createLinearGradient(cx - w / 2, cy, cx + w / 2, cy);
    grad.addColorStop(0, '#d4a574');
    grad.addColorStop(0.5, '#f4d4a4');
    grad.addColorStop(1, '#a87544');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2, cy - h / 2);
    ctx.lineTo(cx + w / 2 - 8, cy + h / 2);
    ctx.lineTo(cx - w / 2 + 8, cy + h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#7a4a1a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // weave lines
    ctx.strokeStyle = 'rgba(122, 74, 26, 0.5)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const t = i / 4;
      const y = cy - h / 2 + h * t;
      const left = cx - w / 2 + 8 * t;
      const right = cx + w / 2 - 8 * t;
      ctx.beginPath();
      ctx.moveTo(left, y);
      ctx.lineTo(right, y);
      ctx.stroke();
    }

    // top rim
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(cx - w / 2 - 2, cy - h / 2 - 4, w + 4, 6);
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(50, t - lastTime);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    finalScore.style.display = 'none';
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    finalScoreValue.textContent = score;
    finalScore.style.display = 'block';
    playBtn.textContent = 'REJOUER';
    overlay.classList.remove('hidden');
  }

  // controls
  playBtn.addEventListener('click', start);

  document.addEventListener('keydown', (e) => {
    if (!running) return;
    if (e.key === 'ArrowLeft') basket.target -= 50;
    if (e.key === 'ArrowRight') basket.target += 50;
  });

  function pointerMove(clientX) {
    const rect = canvas.getBoundingClientRect();
    basket.target = clientX - rect.left;
  }

  canvas.addEventListener('mousemove', (e) => {
    if (running) pointerMove(e.clientX);
  });

  canvas.addEventListener('touchstart', (e) => {
    if (running && e.touches[0]) {
      e.preventDefault();
      pointerMove(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (running && e.touches[0]) {
      e.preventDefault();
      pointerMove(e.touches[0].clientX);
    }
  }, { passive: false });

  // init
  resize();
  initStars();
  reset();
  draw();
</script>
</body>
</html>
