name: Deploy Pages

# Deploie le contenu statique de public/ sur GitHub Pages, pour permettre de
# tester le jeu (Phase 1, sans serveur multijoueur) directement dans un
# navigateur, sans rien installer.
on:
  push:
    branches:
      - claude/paintball-3d-multiplayer-o6ji8j
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
